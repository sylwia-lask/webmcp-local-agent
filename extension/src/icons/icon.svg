<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="white" opacity="0.06"/>

  <!-- Connection lines (WebMCP tool graph) -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <line x1="64" y1="64" x2="34" y2="36"/>
    <line x1="64" y1="64" x2="94" y2="36"/>
    <line x1="64" y1="64" x2="34" y2="92"/>
    <line x1="64" y1="64" x2="94" y2="92"/>
  </g>

  <!-- Outer nodes (tools on the page) -->
  <g fill="url(#node)">
    <circle cx="34" cy="36" r="9"/>
    <circle cx="94" cy="36" r="9"/>
    <circle cx="34" cy="92" r="9"/>
    <circle cx="94" cy="92" r="9"/>
  </g>

  <!-- Central agent core -->
  <circle cx="64" cy="64" r="20" fill="#0F172A"/>
  <circle cx="64" cy="64" r="20" fill="url(#bg)" opacity="0.25"/>
  <circle cx="64" cy="64" r="20" fill="none" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Agent "eyes" spark -->
  <circle cx="57" cy="61" r="4" fill="#FFFFFF"/>
  <circle cx="71" cy="61" r="4" fill="#FFFFFF"/>
  <path d="M56 73 q8 6 16 0" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
